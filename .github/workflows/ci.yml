name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack pnpm@10.26.0 install --frozen-lockfile
      - run: corepack pnpm@10.26.0 run typecheck
      - run: node --test --experimental-strip-types "agent/**/*.test.ts"
      # Convex mutations need the convex-test harness, so they run under vitest.
      # Without this line the mutation tests exist but never execute in CI.
      - run: corepack pnpm@10.26.0 run test:convex
      - run: corepack pnpm@10.26.0 run build
      - run: npx tsc -p convex/tsconfig.json --noEmit
      - run: |
          if grep -rn "$(printf '\342\200\224')" --exclude-dir=node_modules --include="*.ts" --include="*.md" --include="*.json" .; then
            exit 1
          fi
